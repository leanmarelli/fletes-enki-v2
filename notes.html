<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestión Fletes Enki · Resumen</title>

    <!-- Fuentes + Bootstrap + Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Tus estilos -->
    <link rel="stylesheet" href="styles/styles.css" />

    <!-- Auth guard (expone window.currentUser) -->
    <script id="auth-guard" type="module" src="./js/auth-guard.js" data-guard="user"></script>

    <script type="module">
        import { applyFeatureGates, installActionGuards } from './js/gate.js';

        function boot() {
            applyFeatureGates();
            installActionGuards();
        }
        function readyThenBoot() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot, { once: true });
            } else {
                boot();
            }
        }
        document.addEventListener('auth:ready', readyThenBoot, { once: true });
        if (window.currentUser) readyThenBoot();
    </script>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container container-tiny position-relative">
            <!-- Back -->
            <button id="btnBack" type="button" class="btn btn-outline-light btn-icon-nav me-2" aria-label="Volver">
                <!-- Usá este SVG si no tenés Bootstrap Icons -->
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path d="M15 6l-6 6 6 6" />
                </svg>
            </button>

            <!-- Título centrado fijo -->
            <span class="navbar-brand mx-0 position-absolute start-50 translate-middle-x navbar-title">
                Gestión Fletes Enki
            </span>

            <!-- Menú -->
            <button class="navbar-toggler ms-auto btn-icon-nav border-0 position-relative" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu"
                aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
                <span id="navNotesBadge"
                    class="badge-circle bg-danger text-white position-absolute bottom start-100 translate-middle d-none">0</span>
            </button>


        </div>
    </nav>

    <!-- MENÚ LATERAL -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menú</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body">
            <ul class="list-unstyled">
                <li data-visible-for="admin">
                    <a href="index.html" class="btn btn-outline-dark w-100 mb-2">Inicio</a>
                </li>

                <li data-visible-for="user">
                    <a id="linkMiAgenda" href="#" class="btn btn-outline-dark w-100 mb-2">Mi agenda</a>
                </li>

                <li data-visible-for="admin">
                    <a href="new-trip.html" class="btn btn-outline-dark w-100 mb-2">Cargar agenda</a>
                </li>

                <li data-visible-for="admin">
                    <a class="btn btn-outline-dark w-100 mb-2" data-bs-toggle="collapse" href="#collapseAgendasMenu"
                        role="button" aria-controls="collapseAgendasMenu">
                        Ver agendas
                    </a>
                    <div class="collapse mb-4" id="collapseAgendasMenu">
                        <div class="agendas-card p-2 bg-light border rounded-3">
                            <div id="listaFleterosMenu" class="list-group list-group-flush agendas-list"></div>
                        </div>
                    </div>
                </li>

                <a id="menuNotasLink" href="notes.html" class="btn btn-outline-dark w-100 mb-2 position-relative">
                    Notas
                    <span id="badgeMenuNotas"
                        class="badge-circle bg-danger text-white position-absolute top-0 start-100 translate-middle d-none">0</span>
                </a>

                <li>
                    <a href="summary-data.html" class="btn btn-outline-dark w-100 mb-2">Resumen</a>
                </li>

                <li>
                    <a href="login.html?logout=1" data-logout class="btn btn-outline-danger w-100">Cerrar sesión</a>
                </li>
            </ul>
        </div>
    </div>

    <main class="container container-tiny py-4">
        <h3 id="formTitle" class="text-center mb-1">Notas</h3>
        <p class="text-center text-muted mb-3">Anotá tus pendientes o recordatorios importantes</p>

        <div class="d-flex align-items-center justify-content-between mb-3">
            <button id="btnCreateNote" class="btn btn-success">
                <i class="bi bi-plus-circle me-1"></i> Crear nueva nota
            </button>
        </div>

        <div class="sd-card p-3 mb-3">
            <div class="d-flex align-items-center justify-content-between">
                <div class="text-uppercase text-muted small fw-bold">Activas</div>
            </div>
            <div id="activeNotes" class="vstack gap-2 mt-2"></div>
            <div id="noActive" class="text-secondary small d-none">No hay notas activas.</div>
        </div>

        <div class="sd-card p-3">
            <div class="d-flex align-items-center justify-content-between">
                <div class="text-uppercase text-muted small fw-bold">Resuelto</div>
                <button id="btnToggleResolved" class="btn btn-light btn-icon" type="button" data-bs-toggle="collapse"
                    data-bs-target="#resolvedWrap" aria-controls="resolvedWrap" aria-expanded="true"
                    title="Ocultar resueltos">
                    <i id="icoResolved" class="bi bi-eye"></i>
                </button>
            </div>
            <div id="resolvedWrap" class="collapse show mt-2">
                <div id="resolvedNotes" class="vstack gap-2"></div>
                <div id="noResolved" class="text-secondary small d-none">No hay notas resueltas.</div>
            </div>
        </div>
    </main>


    <!-- overlay de carga -->
    <div id="sd-loading" class="sd-loading d-none">
        <div class="spinner-border text-primary" role="status" aria-label="Cargando…"></div>
    </div>


    <div id="appLoading" class="app-loading">
        <div class="spinner"></div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu wiring general (collapse agendas, mi agenda, highlight, etc.) -->

    <!-- datepicker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>

    <script type="module" src="js/index.js"></script> <!-- si lo usás -->
    <script type="module" src="js/notes-bell.js"></script> <!-- si lo usás -->
    <script type="module" src="js/notas.js"></script> <!-- SIEMPRE al final -->

    <script>
        (function markActiveOffcanvas() {
            const path = (location.pathname.split('/').pop() || 'index.html').toLowerCase();

            document.querySelectorAll('#offcanvasMenu a.btn[href]').forEach(a => {
                const href = (a.getAttribute('href') || '').split('?')[0].toLowerCase();
                const isCollapse = a.dataset.bsToggle === 'collapse' || href.startsWith('#');
                if (isCollapse || !href) return;

                const match = href === path || (href.endsWith('index.html') && (path === '' || path === 'index.html'));
                a.classList.toggle('btn-success', match);
                a.classList.toggle('text-white', match);
                a.classList.toggle('btn-outline-dark', !match);
            });
        })();
    </script>


</body>

</html>
