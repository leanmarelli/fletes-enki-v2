<!DOCTYPE html>
<html lang="en">

<head>

    <title>Gestión Fletes Enki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css?v=20261108">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <script id="auth-guard" type="module" src="./js/auth-guard.js?v=20261108" data-guard="admin"></script>

    <script type="module">
        import { applyFeatureGates, installActionGuards } from './js/gate.js';

        function boot() {
            applyFeatureGates();
            installActionGuards();
        }

        function readyThenBoot() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot, { once: true });
            } else {
                boot();
            }
        }

        // Correr cuando auth esté lista… y además esperar DOM
        document.addEventListener('auth:ready', readyThenBoot, { once: true });

        // Si auth ya estaba lista antes de que este script cargue
        if (window.currentUser) readyThenBoot();
    </script>




</head>

<body>
