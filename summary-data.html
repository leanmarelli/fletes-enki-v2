<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestión Fletes Enki · Resumen</title>

    <!-- Fuentes + Bootstrap + Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Tus estilos -->
    <link rel="stylesheet" href="styles/styles.css" />

    <!-- Auth guard (expone window.currentUser) -->
    <script id="auth-guard" type="module" src="./js/auth-guard.js" data-guard="user"></script>

    <!-- Pequeño boot de gates -->
    <script type="module">
        import { applyFeatureGates, installActionGuards } from './js/gate.js';

        function boot() {
            applyFeatureGates();
            installActionGuards();
        }
        function readyThenBoot() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot, { once: true });
            } else {
                boot();
            }
        }
        document.addEventListener('auth:ready', readyThenBoot, { once: true });
        if (window.currentUser) readyThenBoot();
    </script>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container container-tiny position-relative">
            <!-- Back -->
            <button id="btnBack" type="button" class="btn btn-outline-light btn-icon-nav me-2" aria-label="Volver">
                <!-- Usá este SVG si no tenés Bootstrap Icons -->
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path d="M15 6l-6 6 6 6" />
                </svg>
            </button>

            <!-- Título centrado fijo -->
            <span class="navbar-brand mx-0 position-absolute start-50 translate-middle-x navbar-title">
                Gestión Fletes Enki
            </span>

            <!-- Menú -->
            <button class="navbar-toggler ms-auto btn-icon-nav border-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <!-- MENÚ LATERAL -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menú</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body">
            <ul class="list-unstyled">
                <li data-visible-for="admin">
                    <a href="index.html" class="btn btn-outline-dark w-100 mb-2">Inicio</a>
                </li>

                <li data-visible-for="user">
                    <a id="linkMiAgenda" href="#" class="btn btn-outline-dark w-100 mb-2">Mi agenda</a>
                </li>

                <li data-visible-for="admin">
                    <a href="new-trip.html" class="btn btn-outline-dark w-100 mb-2">Cargar agenda</a>
                </li>

                <li data-visible-for="admin">
                    <a class="btn btn-outline-dark w-100 mb-2" data-bs-toggle="collapse" href="#collapseAgendasMenu"
                        role="button" aria-controls="collapseAgendasMenu">
                        Ver agendas
                    </a>
                    <div class="collapse mb-4" id="collapseAgendasMenu">
                        <div class="agendas-card p-2 bg-light border rounded-3">
                            <div id="listaFleterosMenu" class="list-group list-group-flush agendas-list"></div>
                        </div>
                    </div>
                </li>

                <li>
                    <a href="summary-data.html" class="btn btn-outline-dark w-100 mb-2">Resumen</a>
                </li>

                <li>
                    <a href="login.html?logout=1" data-logout class="btn btn-outline-danger w-100">Cerrar sesión</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- barra de personas (se llena desde JS) -->
    <div class="container container-tiny my-3">
        <div id="personasTabs" class="pill-nav" role="tablist" aria-label="Personas"></div>
    </div>


    <!-- selector de periodo -->
    <div class="container container-tiny mb-2">
        <div id="rangeBar" class="d-flex justify-content-center align-items-center gap-2">

            <button id="btnPrev" class="btn btn-outline-secondary day-chip date-chip flex-row" title="Semana anterior"
                style="min-width: fit-content;">
                <i class="bi bi-chevron-left"></i>
            </button>

            <!-- WRAP que apila el input transparente encima del chip -->
            <div class="range-wrap">
                <!-- input REAL (oculto visualmente) -->
                <input id="rangeDate" type="date" class="visually-hidden" aria-label="Elegir fecha" autocomplete="off">

                <!-- tu chip -->
                <button id="rangeChip" type="button" class="btn btn-outline-secondary day-chip date-chip flex-row"
                    tabindex="-1" aria-hidden="true">
                    <i class="bi bi-calendar3"></i>
                    <span id="rangeChipLabel"></span>
                </button>
            </div>




            <button id="btnNext" class="btn btn-outline-secondary day-chip date-chip flex-row" title="Semana siguiente"
                style="min-width: fit-content;">
                <i class="bi bi-chevron-right"></i>
            </button>

            <button id="btnToday" class="btn btn-outline-secondary day-chip btn-sm"
                style="min-width: fit-content;">Hoy</button>
        </div>
    </div>



    <!-- overlay de carga -->
    <div id="sd-loading" class="sd-loading d-none">
        <div class="spinner-border text-primary" role="status" aria-label="Cargando…"></div>
    </div>

    <!-- CONTENIDO -->
    <div class="container container-tiny my-4">
        <!-- AQUÍ es donde se insertan las cards -->
        <div id="cardsContainer"></div>
    </div>


    <!-- Modal de ajustes (para fletero, admin) -->
    <div class="modal fade" id="ajusteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 id="ajTitle" class="modal-title">Sumar / Descontar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="ajScope" value="week" />
                    <div class="mb-3">
                        <label class="form-label">Importe</label>
                        <input id="ajMonto" type="number" class="form-control" placeholder="Ej: 50000">
                    </div>
                    <div class="mb-1">
                        <label class="form-label">Motivo</label>
                        <textarea id="ajMotivo" class="form-control" rows="2"
                            placeholder="Ej: Amortización vehículo"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="ajSave" type="button" class="btn btn-success">Aplicar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="appLoading" class="app-loading">
        <div class="spinner"></div>
    </div>


    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu wiring general (collapse agendas, mi agenda, highlight, etc.) -->
    <script type="module" src="js/index.js"></script>

    <!-- datepicker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>

    <script type="module" src="js/summary-data.js"></script>

    <!-- Lógica dinámica del resumen -->
    <script type="module" src="js/summary-data.js"></script>

</body>

</html>
